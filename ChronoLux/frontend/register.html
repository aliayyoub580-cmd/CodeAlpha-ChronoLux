<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="section">
    <div class="container auth-layout">
      <section class="auth-card">
        <p class="eyebrow">Join ChronoLux</p>
        <h1 class="section-title">Create your account</h1>
        <form data-register-form>
          <div class="form-group"><label for="name">Full Name</label><input id="name" name="name" required></div>
          <div class="form-group"><label for="registerEmail">Email</label><input id="registerEmail" name="email" type="email" required></div>
          <div class="form-group"><label for="registerPassword">Password</label><input id="registerPassword" name="password" type="password" required></div>
          <div class="form-group"><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" name="confirmPassword" type="password" required></div>
          <p class="form-message" data-form-message></p>
          <button class="btn btn--primary" type="submit">Register</button>
        </form>
        <p class="muted">Already have an account? <a href="login.html">Login here</a></p>
      </section>
      <section class="auth-card" style="display:grid;place-items:center;">
        <div class="hero__watch" style="max-width:420px;">
          <img src="http://localhost:5000/public/womens%20watches/hero-elegance-women.jpg" alt="Elegant women's watch close-up">
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
