<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html"><span class="brand__mark">CL</span><span>ChronoLux</span></a>
      <button class="menu-toggle" data-menu-toggle aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <nav class="nav__menu" data-nav-menu>
        <a class="nav__link" href="index.html">Home</a>
        <a class="nav__link" href="shop.html">Shop</a>
        <a class="nav__link" href="about.html">About</a>
        <a class="nav__link" href="contact.html">Contact</a>
      </nav>
      <div class="nav__actions">
        <a class="btn btn--secondary" data-auth-link href="login.html">Login</a>
        <a class="btn btn--primary" data-cart-button href="cart.html">Cart <span class="badge" data-cart-count>0</span></a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container checkout-layout">
      <section class="checkout-card">
        <p class="eyebrow">Checkout</p>
        <h1 class="section-title">Complete your order</h1>
        <form data-checkout-form>
          <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" name="fullName" required></div>
          <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
          <div class="form-group"><label for="phone">Phone Number</label><input id="phone" name="phone" required></div>
          <div class="form-group"><label for="address">Shipping Address</label><input id="address" name="address" required></div>
          <div class="form-group"><label for="city">City</label><input id="city" name="city" required></div>
          <div class="form-group"><label for="postalCode">Postal Code</label><input id="postalCode" name="postalCode" required></div>
          <div class="form-group"><label for="paymentMethod">Payment Method</label>
            <select id="paymentMethod" name="paymentMethod">
              <option>Cash on Delivery</option>
              <option>Credit/Debit Card</option>
            </select>
          </div>
          <p class="form-message" data-checkout-message></p>
          <button class="btn btn--primary" type="submit">Place Order</button>
        </form>
      </section>
      <aside class="checkout-card">
        <p class="eyebrow">Order Summary</p>
        <div data-checkout-summary></div>
      </aside>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
