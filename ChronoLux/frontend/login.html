<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChronoLux | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="section">
    <div class="container auth-layout">
      <section class="auth-card">
        <p class="eyebrow">Welcome Back</p>
        <h1 class="section-title">Sign in to ChronoLux</h1>
        <form data-login-form>
          <div class="form-group"><label for="loginEmail">Email</label><input id="loginEmail" name="email" type="email" required></div>
          <div class="form-group"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" required></div>
          <p class="form-message" data-form-message></p>
          <button class="btn btn--primary" type="submit">Login</button>
        </form>
        <p class="muted">No account? <a href="register.html">Create one</a></p>
      </section>
      <section class="auth-card" style="display:grid;place-items:center;">
        <div class="hero__watch" style="max-width:420px;">
          <img src="http://localhost:5000/public/men%20watches/signature-luxury-men.jpg" alt="Luxury watch close-up">
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
