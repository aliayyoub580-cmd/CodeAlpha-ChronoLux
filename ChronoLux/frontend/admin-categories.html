<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Categories - ChronoLux</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div class="admin-logo"><span>ChronoLux</span></div>
      <nav class="admin-nav">
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Main</div>
          <a href="admin.html" class="admin-nav-link"><i class="fas fa-chart-line"></i><span class="admin-nav-link-label">Dashboard</span></a>
          <a href="admin-products.html" class="admin-nav-link"><i class="fas fa-watch"></i><span class="admin-nav-link-label">Products</span></a>
          <a href="admin-orders.html" class="admin-nav-link"><i class="fas fa-shopping-bag"></i><span class="admin-nav-link-label">Orders</span></a>
        </div>
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Manage</div>
          <a href="admin-users.html" class="admin-nav-link"><i class="fas fa-users"></i><span class="admin-nav-link-label">Customers</span></a>
          <a href="admin-categories.html" class="admin-nav-link active"><i class="fas fa-folder"></i><span class="admin-nav-link-label">Categories</span></a>
        </div>
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Analytics</div>
          <a href="admin-analytics.html" class="admin-nav-link"><i class="fas fa-chart-bar"></i><span class="admin-nav-link-label">Analytics</span></a>
          <a href="admin-settings.html" class="admin-nav-link"><i class="fas fa-cog"></i><span class="admin-nav-link-label">Settings</span></a>
        </div>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="index.html" class="admin-nav-link" style="font-size: 13px;"><i class="fas fa-arrow-left"></i><span class="admin-nav-link-label">Back to Store</span></a>
        <button id="logoutBtn" class="admin-nav-link" style="font-size: 13px; width: 100%; text-align: left; border: none; background: none; cursor: pointer;"><i class="fas fa-sign-out-alt"></i><span class="admin-nav-link-label">Logout</span></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left"><div class="admin-page-breadcrumb"><strong>Admin</strong> / Categories</div></div>
        <div class="admin-topbar-right">
          <div class="admin-profile" id="adminProfile">
            <div class="admin-profile-avatar" id="adminAvatar">A</div>
            <div class="admin-profile-info">
              <div class="admin-profile-name" id="adminName">Admin User</div>
              <div class="admin-profile-role">Administrator</div>
            </div>
          </div>
        </div>
      </div>

      <div class="admin-content">
        <div class="admin-flex-between" style="margin-bottom: var(--space-40);">
          <div>
            <h1 class="admin-page-title">Category Management</h1>
            <p class="admin-page-subtitle">Organize products into luxury-focused categories.</p>
          </div>
          <button class="admin-btn admin-btn-primary" id="addCategoryBtn">
            <i class="fas fa-plus"></i> Add Category
          </button>
        </div>

        <div class="admin-card">
          <div id="categoriesContainer">
            <div style="text-align: center; padding: 40px;">
              <p class="admin-text-muted">Loading categories...</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/admin-categories.js"></script>
</body>
</html>
