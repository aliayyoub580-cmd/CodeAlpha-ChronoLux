<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Customers - ChronoLux</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="admin-wrapper">
    <!-- Sidebar Navigation (same as other pages) -->
    <aside class="admin-sidebar">
      <div class="admin-logo"><span>ChronoLux</span></div>
      <nav class="admin-nav">
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Main</div>
          <a href="admin.html" class="admin-nav-link"><i class="fas fa-chart-line"></i><span class="admin-nav-link-label">Dashboard</span></a>
          <a href="admin-products.html" class="admin-nav-link"><i class="fas fa-watch"></i><span class="admin-nav-link-label">Products</span></a>
          <a href="admin-orders.html" class="admin-nav-link"><i class="fas fa-shopping-bag"></i><span class="admin-nav-link-label">Orders</span></a>
        </div>
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Manage</div>
          <a href="admin-users.html" class="admin-nav-link active"><i class="fas fa-users"></i><span class="admin-nav-link-label">Customers</span></a>
          <a href="admin-categories.html" class="admin-nav-link"><i class="fas fa-folder"></i><span class="admin-nav-link-label">Categories</span></a>
        </div>
        <div class="admin-nav-section">
          <div class="admin-nav-section-title">Analytics</div>
          <a href="admin-analytics.html" class="admin-nav-link"><i class="fas fa-chart-bar"></i><span class="admin-nav-link-label">Analytics</span></a>
          <a href="admin-settings.html" class="admin-nav-link"><i class="fas fa-cog"></i><span class="admin-nav-link-label">Settings</span></a>
        </div>
      </nav>
      <div class="admin-sidebar-footer">
        <a href="index.html" class="admin-nav-link" style="font-size: 13px;"><i class="fas fa-arrow-left"></i><span class="admin-nav-link-label">Back to Store</span></a>
        <button id="logoutBtn" class="admin-nav-link" style="font-size: 13px; width: 100%; text-align: left; border: none; background: none; cursor: pointer;"><i class="fas fa-sign-out-alt"></i><span class="admin-nav-link-label">Logout</span></button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left"><div class="admin-page-breadcrumb"><strong>Admin</strong> / Customers</div></div>
        <div class="admin-topbar-right">
          <div class="admin-profile" id="adminProfile">
            <div class="admin-profile-avatar" id="adminAvatar">A</div>
            <div class="admin-profile-info">
              <div class="admin-profile-name" id="adminName">Admin User</div>
              <div class="admin-profile-role">Administrator</div>
            </div>
          </div>
        </div>
      </div>

      <div class="admin-content">
        <div style="margin-bottom: var(--space-40);">
          <h1 class="admin-page-title">Customer Management</h1>
          <p class="admin-page-subtitle">View and manage all registered customers and their order history.</p>
        </div>

        <div class="admin-card" style="margin-bottom: var(--space-24);">
          <div class="admin-form-grid">
            <div class="admin-form-group" style="margin-bottom: 0;">
              <input type="text" placeholder="Search by name or email..." class="admin-input" id="searchInput" style="padding: 14px 18px;">
            </div>
            <div class="admin-form-group" style="margin-bottom: 0;">
              <select class="admin-select" id="roleFilter" style="padding: 14px 18px;">
                <option value="">All Roles</option>
                <option value="customer">Customers</option>
                <option value="admin">Admins</option>
              </select>
            </div>
          </div>
        </div>

        <div class="admin-card">
          <div id="usersContainer"></div>
        </div>

        <div id="paginationContainer"></div>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/admin-users.js"></script>
</body>
</html>
