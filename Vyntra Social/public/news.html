<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily News | Vyntra Social</title>
    <meta name="description" content="Read ten fresh stories selected daily from Hacker News on Vyntra Social.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://vyntra-socila.vercel.app/news">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script defer src="/js/auth.js"></script>

    <div id="appNavbar"></div>

    </main>
